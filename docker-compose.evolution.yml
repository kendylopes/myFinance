services:
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: myfinance-evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=myfinance_secret_key_123456
      - DATABASE_ENABLED=false
      - REDIS_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - QRCODE_LIMIT=30
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
